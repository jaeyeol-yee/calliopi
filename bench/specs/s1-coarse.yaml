# S1: where the newest models stand at medium effort, the noise floor (a replicate of the reference
# arm) and what Calliopi adds (harness off on the flagships). Real models: approve a cost cap first.
name: s1-coarse
runs: 3
target: 0.9
timeoutMinutes: 10
budgetUsd: 30
tasks: all
arms:
  - { model: anthropic/claude-opus-5-5, effort: medium }
  - { model: anthropic/claude-opus-5-5, effort: medium, label: opus-5-5@medium-replicate }
  - { model: anthropic/claude-fable-5-2, effort: medium }
  - { model: anthropic/claude-sonnet-5-5, effort: medium }
  - { model: openai/gpt-6.2-astra, effort: medium }
  - { model: openai/gpt-6.2-sol, effort: medium }
  - { model: openai/gpt-6.1-terra, effort: medium }
  - { model: anthropic/claude-fable-5-2, effort: medium, harness: off }
  - { model: openai/gpt-6.2-astra, effort: medium, harness: off }
