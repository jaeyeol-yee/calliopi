# S2 (drop), OpenAI half: gpt-6.1-terra (rerun whole: a usage limit cut its second repetition in
# s2-drop), gpt-6.2-sol and gpt-6.2-astra, low → medium → high → xhigh, all 20 tasks, two runs.
# Read together with s2-drop's Anthropic arms (same harness and tasks).
name: s2-drop-openai
runs: 2
target: 0.9
timeoutMinutes: 10
budgetUsd: 25
concurrency: 8
tasks: all
arms:
  - { model: openai/gpt-6.1-terra, effort: [low, medium, high, xhigh] }
  - { model: openai/gpt-6.2-sol, effort: [low, medium, high, xhigh] }
  - { model: openai/gpt-6.2-astra, effort: [low, medium, high, xhigh] }
