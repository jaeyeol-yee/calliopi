version: 1
prompt: |
  Add an optional `locale` argument ('en' or 'de', default 'en') to formatPrice, summary and invoiceLine,
  passed through from summary and invoiceLine to formatPrice. Do not add dependencies or use Intl.
  The tests in test/ describe the expected output; do not change them.
scope: [src/format.js, src/cart.js, src/invoice.js]
oracle:
  - command: node --test
  - unchanged: [test/locale.test.js]
  - file: src/format.js
    absent: "Intl\\."
