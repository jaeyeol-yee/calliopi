version: 2
prompt: |
  Convert the callback APIs in src/ (store.read, readWithRetry, greeting, nextCount) to return promises
  and take no callback. Keep the retry behavior. The tests in test/ describe the result; do not change them.
scope: [src/store.js, src/retry.js, src/greet.js, src/counter.js]
oracle:
  - command: node --test
    dimension: outcome
  - unchanged: [test/promises.test.js]
    dimension: outcome
  # hidden/ is copied over the work directory after the run; the model never sees it.
  - hidden: node --test test/hidden.test.js
    dimension: hidden
