version: 4
prompt: |
  Convert the callback APIs in src/ (store.read, readWithRetry, greeting, nextCount) to return promises
  and take no callback. Keep the retry behavior. The tests in test/ describe the result; do not change them.
scope: [src/store.js, src/retry.js, src/greet.js, src/counter.js]
oracle:
  - command: node --test
    dimension: outcome
  - unchanged: [test/promises.test.js]
    dimension: outcome
  # hidden/ is copied over the work directory after the run; the model never sees it.
  - hidden: node --test test/hidden.test.js
    dimension: hidden
  # What the answer must say (coverage) and may say; other blocks of the answer count as surplus.
  - content:
      required:
        change: ["promise", "async", "callback"]
      allowed:
        verification: ["node --test", "tests? (now |all |both )?pass", "\\b(verif|confirm|ran|run)"]
        constraints-kept: ["(not|n't|no|without|never) (chang|touch|modif|edit|add)", "(unchanged|untouched|as (it|they) (was|were))"]
        per-file-detail: ["\\b(src|test)/[\\w./-]+"]
