# Checks the runner, oracle and report with the scripted faux/bench model: no API key, no cost.
version: 2
prompt: Make `node --test` pass.
scope: [src/greet.js]
oracle:
  - command: node --test
    dimension: outcome
  - unchanged: [test/greet.test.js]
    dimension: outcome
  # hidden/ is copied over the work directory after the run; the model never sees it.
  - hidden: node --test test/hidden.test.js
    dimension: hidden
faux:
  - tool: edit
    args:
      path: src/greet.js
      edits:
        - oldText: "return 'Hello, ';"
          newText: "return `Hello, ${name}`;"
  - text: "Fixed greet."
