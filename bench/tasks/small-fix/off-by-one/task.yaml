version: 2
prompt: |
  `node --test` fails in this project. Fix the bug in the source. Do not change the tests.
scope: [src/range.js]
oracle:
  - command: node --test
    dimension: outcome
  - unchanged: [test/range.test.js]
    dimension: outcome
  # hidden/ is copied over the work directory after the run; the model never sees it.
  - hidden: node --test test/hidden.test.js
    dimension: hidden
