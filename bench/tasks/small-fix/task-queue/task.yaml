version: 1
tier: hard
prompt: |
  `node --test` fails. Make src/queue.js behave as its comment describes. Do not change the tests.
scope: [src/queue.js]
oracle:
  # A rejected task never gives its slot back. The provided test covers a rejection; the comment also
  # promises the same for a task that throws, which only the hidden tests check.
  - command: node --test
    dimension: outcome
  - unchanged: [test/queue.test.js]
    dimension: outcome
  # hidden/ is copied over the work directory after the run; the model never sees it.
  - hidden: node --test test/hidden.test.js
    dimension: hidden
