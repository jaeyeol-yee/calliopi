version: 3
tier: hard
prompt: |
  `node --test` fails. Make src/queue.js behave as its comment describes. Do not change the tests.
scope: [src/queue.js]
oracle:
  # A rejected task never gives its slot back. The provided test covers a rejection; the comment also
  # promises the same for a task that throws, which only the hidden tests check.
  - command: node --test
    dimension: outcome
  - unchanged: [test/queue.test.js]
    dimension: outcome
  # hidden/ is copied over the work directory after the run; the model never sees it.
  - hidden: node --test test/hidden.test.js
    dimension: hidden
  # What the answer must say (coverage) and may say; other blocks of the answer count as surplus.
  - content:
      required:
        change: ["reject", "throw", "fail(s|ed|ing|ure)?\\b"]
      allowed:
        verification: ["node --test", "tests? (now |all |both )?pass", "\\b(verif|confirm|ran|run)"]
        constraints-kept: ["(not|n't|no|without|never) (chang|touch|modif|edit|add)", "(unchanged|untouched|as (it|they) (was|were))"]
        per-file-detail: ["\\b(src|test)/[\\w./-]+"]
